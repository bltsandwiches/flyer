<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Order Form</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <iframe id="dynamic-frame" src="about:blank"></iframe>
    <script>
        const targetBaseUrl = "https://christ-springer-palmer-chassis.trycloudflare.com/flyer/customer_order.php";
        
        // Parse incoming query parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // Check if 'referral' parameter exists and is not empty
        if (!urlParams.has('referral') || !urlParams.get('referral').trim()) {
            // OPTION A: Automatically assign a default referral if missing
            urlParams.set('referral', 'general'); 
            
            // OPTION B: If you want to block them instead, uncomment the line below:
            // document.body.innerHTML = "<h2 style='text-align:center; margin-top:20vh; font-family:sans-serif;'>Error: A valid referral link is required to access this page.</h2>";
        }

        // Rebuild the query string to pass along to the dynamic site
        const finalQuery = "?" + urlParams.toString();

        // Point the iframe to your dynamic site with the enforced referral
        document.getElementById('dynamic-frame').src = targetBaseUrl + finalQuery;
    </script>
</body>
</html>
